name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew :lemuroid-app:assembleFreeDynamicDebug --stacktrace

      - name: Collect APK
        run: cp "$(find lemuroid-app/build/outputs/apk -name '*.apk' | head -1)" AndysEmulator.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AndysEmulator
          path: AndysEmulator.apk

      - name: Publish release (direct APK download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Andy's Emulator build ${{ github.run_number }}
          body: Tap AndysEmulator.apk below to download, then open it to install.
          files: AndysEmulator.apk
          make_latest: true
